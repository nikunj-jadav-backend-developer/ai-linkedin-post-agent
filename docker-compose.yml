services:

  backend:
    build:
      context: ./backend

    container_name: linkedin-agent

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./backend/src/app/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest

    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana
      - ./backend/src/app/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources

    depends_on:
      - prometheus

volumes:
  grafana-storage: